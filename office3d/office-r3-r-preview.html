<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>办公区 rev3 独立模块预览</title><style>:root{--bg:#f4f1ea;--fg:#49453e;--panel:#fffdf7;--line:#b8935a}:root[data-theme=dark]{--bg:#292721;--fg:#f6f2e9;--panel:#39362f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}header,footer{padding:14px 20px;border-bottom:1px solid var(--line)}h1,p{margin:0}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}button,select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;color:var(--fg);background:var(--panel);min-height:40px}#stage{height:calc(100vh - 170px);min-height:320px}canvas{display:block;width:100%;height:100%}</style></head><body><header><h1>办公区 rev3 · 独立模块预览</h1><p>开放工位、植物、前厅家具、同心圆地面纹样；静态资源，无业务请求。</p><div class="tools"><select id="module"><option value="all">全部模块</option><option value="desk">开放办公桌组</option><option value="plants">植物</option><option value="foyer">前厅家具</option><option value="floor">地面纹样</option></select><select id="tier"><option value="high">高档</option><option value="low">低档</option></select><button id="theme">深色主题</button></div></header><div id="stage"></div><footer id="metrics">加载中…</footer><script type="module">
import * as THREE from '/vendor/three/three.module.js'
import { LAYOUT_V3 } from './office-layout.js'
import { buildOpenOfficeDeskGroups } from './office-open-desk-groups.js'
import { buildOfficePlants } from './office-plants.js'
import { buildOfficeFoyerFurniture } from './office-foyer-furniture.js'
import { buildOfficeFloorPattern } from './office-floor-pattern.js'
const stage=document.querySelector('#stage'), metrics=document.querySelector('#metrics'), scene=new THREE.Scene(), root=new THREE.Group(); scene.add(root); const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); stage.append(renderer.domElement); scene.add(new THREE.HemisphereLight(0xffffff,0xb8935a,1.35)); const key=new THREE.DirectionalLight(0xfff3dc,1.1); key.position.set(-8,12,8); scene.add(key); const camera=new THREE.PerspectiveCamera(42,1,.1,100); let modules=[];
const builders={desk:buildOpenOfficeDeskGroups,plants:buildOfficePlants,foyer:buildOfficeFoyerFurniture,floor:buildOfficeFloorPattern}; function build(){modules.forEach(m=>m.dispose()); modules=[]; const selected=module.value==='all'?Object.keys(builders):[module.value]; for(const key of selected) modules.push(builders[key]({THREE,root,layout:LAYOUT_V3,low:tier.value==='low'})); camera.position.set(18,14,20); camera.lookAt(2,0,-4); metrics.textContent=modules.map(m=>{const s=m.summary(); return `${m.root.name}: ${s.calls} 批次 / ${Math.round(s.triangles||0)} 三角形`}).join(' · ')} function resize(){renderer.setSize(stage.clientWidth,stage.clientHeight);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix()} function frame(){requestAnimationFrame(frame);scene.background=new THREE.Color(document.documentElement.dataset.theme==='dark'?0x292721:0xf4f1ea);renderer.render(scene,camera)} module.onchange=build;tier.onchange=build;theme.onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';theme.textContent=dark?'浅色主题':'深色主题'};build();resize();addEventListener('resize',resize);frame();
</script></body></html>
