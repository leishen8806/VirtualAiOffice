<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>DR 仓配园区 · 穿梭机展示预览</title>
  <script type="importmap">{"imports":{"three":"/vendor/three/three.module.js"}}</script>
  <style>
    :root { color-scheme:dark; --bg:#182327; --panel:#223238; --text:#f2e8d3; --line:#567177; --accent:#e0af55 }
    :root[data-theme="light"] { color-scheme:light; --bg:#ebe5d9; --panel:#f8f3e8; --text:#293b3d; --line:#8b9c99; --accent:#885d16 }
    * { box-sizing:border-box }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif }
    header { padding:16px 24px; display:flex; flex-wrap:wrap; gap:16px; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line) }
    h1 { margin:0; font-size:21px } p { margin:0 }
    .tools { display:flex; flex-wrap:wrap; gap:8px }
    button,select { min-height:44px; font:inherit; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:5px; padding:8px 12px; cursor:pointer }
    :focus-visible { outline:3px solid var(--accent); outline-offset:2px }
    #stage { height:calc(100vh - 190px); min-height:420px }
    canvas { display:block; width:100%; height:100%; touch-action:none }
    footer { padding:14px 24px; border-top:1px solid var(--line) }
    #readout { color:var(--accent); font-weight:650 }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>DR 仓配园区 · 穿梭机展示</h1>
      <p>演示数据 · 1 台穿梭机 · 1 条水平双轨 · 拖动旋转 / 滚轮缩放</p>
    </div>
    <div class="tools">
      <select id="tier" aria-label="画质"><option value="high">高档动画</option><option value="low">低档静态</option></select>
      <button id="pause">暂停动画</button>
      <button id="theme">浅色主题</button>
      <button id="measure">测量可见性增量</button>
    </div>
  </header>
  <div id="stage"></div>
  <footer>
    <p id="readout" role="status">准备静态资源…</p>
    <p id="progress">演示数据 · 播放进度 0.0 秒</p>
    <p>深蓝扁平车体、橙色端盖、金色识别线；车顶最多承托 1 个托盘。本页不读取业务接口。</p>
  </footer>
  <script type="module">
    import * as THREE from 'three'
    import { CAMPUS, CAMPUS_SHUTTLE_STRIP, CAMPUS_ZONES } from '/office-layout.js'
    import { buildCampusShuttle } from '/dr-campus-shuttle.js'
    import { createDemoShuttleEventSource, shuttlePlan } from '/dr-campus-shuttle-logic.js'
    import { mergeCampusStatic } from '/dr-campus-registry.js'

    const stage = document.getElementById('stage')
    const quality = { tier: new URLSearchParams(location.search).get('q') === 'low' ? 'low' : 'high' }
    document.getElementById('tier').value = quality.tier
    const scene = new THREE.Scene()
    const camera = new THREE.PerspectiveCamera(42, 1, .1, 200)
    const renderer = new THREE.WebGLRenderer({ antialias:true })
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5))
    renderer.shadowMap.enabled = false
    stage.append(renderer.domElement)
    scene.add(new THREE.HemisphereLight(0xe4eff1, 0x46433d, 2.7))
    const sun = new THREE.DirectionalLight(0xffe5b3, 2.4)
    sun.position.set(-154, 24, 12)
    scene.add(sun)

    const root = new THREE.Group()
    scene.add(root)
    const floor = new THREE.Mesh(new THREE.BoxGeometry(12, .18, 20), new THREE.MeshStandardMaterial({ color:0x6b7779, roughness:.9 }))
    floor.position.set(-145, .09, -1)
    root.add(floor)
    const rackBlue = new THREE.MeshStandardMaterial({ color:0x2d608b, roughness:.65, metalness:.25 })
    const rackOrange = new THREE.MeshStandardMaterial({ color:0xe18a3b, roughness:.66, metalness:.2 })
    for (const x of [-142, -140]) {
      for (const z of [-7.6, -3, 1.6, 5.6]) {
        const post = new THREE.Mesh(new THREE.BoxGeometry(.18, 4, .18), rackBlue)
        post.position.set(x, 2, z)
        root.add(post)
      }
      for (const y of [1.25, 2.65]) {
        const beam = new THREE.Mesh(new THREE.BoxGeometry(.22, .16, 13.4), rackOrange)
        beam.position.set(x, y, -1)
        root.add(beam)
      }
    }

    const canvasTex = (width, height, draw) => {
      const canvas = document.createElement('canvas')
      canvas.width = width
      canvas.height = height
      draw(canvas.getContext('2d'), width, height)
      const texture = new THREE.CanvasTexture(canvas)
      texture.colorSpace = THREE.SRGBColorSpace
      return texture
    }
    const layout = { campus:CAMPUS, zones:CAMPUS_ZONES, shuttle:CAMPUS_SHUTTLE_STRIP }
    const sourceEpoch = performance.now()
    const inspection = new URLSearchParams(location.search).get('inspection') === '1'
    const source = inspection ? {
      snapshot: () => ({ at: 0, events: [] }),
      subscribe: () => () => {},
      advance() { return this.snapshot() },
    } : createDemoShuttleEventSource({
      now: () => performance.now() - sourceEpoch,
      seed:1212,
      plan:shuttlePlan(layout),
    })
    const shuttle = buildCampusShuttle({ THREE, root, layout, quality, canvasTex, eventSource:source })
    const merged = mergeCampusStatic(THREE, root)

    const target = new THREE.Vector3(-146, .8, -1)
    let azimuth=.62, elevation=.42, radius=18, drag=null, paused=false, last=null, sampling=null
    const orbit = () => {
      camera.position.set(
        target.x + radius * Math.cos(elevation) * Math.sin(azimuth),
        target.y + radius * Math.sin(elevation),
        target.z + radius * Math.cos(elevation) * Math.cos(azimuth),
      )
      camera.lookAt(target)
    }
    orbit()
    renderer.domElement.addEventListener('pointerdown', event => {
      drag={x:event.clientX,y:event.clientY}
      renderer.domElement.setPointerCapture(event.pointerId)
    })
    renderer.domElement.addEventListener('pointermove', event => {
      if (!drag) return
      azimuth -= (event.clientX-drag.x)*.006
      elevation = Math.max(.16,Math.min(1.3,elevation+(event.clientY-drag.y)*.006))
      drag={x:event.clientX,y:event.clientY}
      orbit()
    })
    renderer.domElement.addEventListener('pointerup', () => { drag=null })
    renderer.domElement.addEventListener('wheel', event => {
      event.preventDefault()
      radius=Math.max(8,Math.min(45,radius+event.deltaY*.025))
      orbit()
    }, {passive:false})

    const api = {
      renderer, scene, camera, root, shuttle, quality, merged, readings:[],
      measure: () => document.getElementById('measure').click(),
    }
    window.__campusShuttlePreview = api
    document.getElementById('tier').onchange = event => {
      location.href = `${location.pathname}?q=${event.target.value}`
    }
    document.getElementById('pause').onclick = () => {
      paused=!paused
      shuttle.setPaused(paused)
      document.getElementById('pause').textContent=paused?'恢复动画':'暂停动画'
    }
    document.getElementById('theme').onclick = () => {
      const dark=document.documentElement.dataset.theme==='dark'
      document.documentElement.dataset.theme=dark?'light':'dark'
      document.getElementById('theme').textContent=dark?'深色主题':'浅色主题'
    }
    document.getElementById('measure').onclick = () => {
      sampling={step:0,values:[],paused}
      shuttle.setPaused(true)
    }
    const resize = () => {
      renderer.setSize(stage.clientWidth,stage.clientHeight)
      camera.aspect=stage.clientWidth/stage.clientHeight
      camera.updateProjectionMatrix()
    }
    addEventListener('resize',resize)
    document.addEventListener('visibilitychange',() => { last=null })
    resize()

    function frame(time) {
      requestAnimationFrame(frame)
      const dt=last===null?0:Math.max(0,Math.min(.1,(time-last)/1000))
      last=time
      source.advance()
      shuttle.onFrame(dt,{camera})
      scene.background=new THREE.Color(document.documentElement.dataset.theme==='dark'?0x182327:0xebe5d9)
      if (sampling) shuttle.root.visible=sampling.step!==1
      renderer.render(scene,camera)
      const reading={calls:renderer.info.render.calls,triangles:renderer.info.render.triangles}
      if (sampling) {
        sampling.values.push(reading)
        sampling.step++
        if (sampling.step===3) {
          const [on,off,restored]=sampling.values
          api.readings.push({
            tier:quality.tier,on,off,restored,
            calls:on.calls-off.calls,
            triangles:on.triangles-off.triangles,
          })
          const wasPaused=sampling.paused
          sampling=null
          shuttle.root.visible=true
          shuttle.setPaused(wasPaused)
        }
      }
      const summary=shuttle.summary()
      document.getElementById('readout').textContent=`整页 calls ${reading.calls} · 三角形 ${reading.triangles} | 模块 ${JSON.stringify(summary)}`
      document.getElementById('progress').textContent=`演示数据 · 播放进度 ${((summary.sourceMs||0)/1000).toFixed(1)} 秒 · 动画 ${((summary.animationMs||0)/1000).toFixed(1)} 秒`
    }
    requestAnimationFrame(frame)
  </script>
</body>
</html>
