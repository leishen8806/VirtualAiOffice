<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="./assets/logo.png">
<title>智序工场 · 办公室 3D</title>
<style>
  :root {
    --gold:#b69a64; --gold2:#d9c08c; --ivory:#f4f1eb; --graphite:#202326;
    --glass:rgba(22,24,28,.72); --glass2:rgba(32,35,40,.86); --line:rgba(255,255,255,.12); --text:#f2efe8; --muted:#a3a7b0;
    --ok:#35d07f; --warn:#ffb020; --bad:#ff5d5d; --info:#6fa8ff;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#0d0f12; color:var(--text); font:13px/1.45 "Inter","Segoe UI","Microsoft YaHei",system-ui,sans-serif; overflow:hidden; }
  button { font:inherit; color:inherit; }
  #stage { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; outline:none; }
  .glass { background:var(--glass); border:1px solid var(--line); border-radius:16px; backdrop-filter:blur(14px) saturate(1.2); box-shadow:0 10px 30px rgba(0,0,0,.28); }

  /* 顶栏：品牌 + 状态徽章 */
  #top { position:fixed; z-index:5; top:14px; left:14px; right:14px; display:flex; align-items:center; gap:10px; pointer-events:none; }
  #top > * { pointer-events:auto; }
  .brand { display:flex; align-items:center; gap:10px; padding:8px 14px 8px 10px; }
  .brand img { height:30px; }
  .brand h1 { margin:0; font-size:14px; letter-spacing:1px; color:var(--gold2); white-space:nowrap; }
  .brand .sub { font-size:11px; color:var(--muted); }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; background:var(--muted); vertical-align:middle; }
  .dot.live { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .dot.off { background:var(--bad); }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(14px); font-size:12px; color:var(--muted); }
  .chip b { color:var(--text); font-size:15px; }
  .chip.stall b, .chip.stall { color:var(--warn); border-color:rgba(255,176,32,.5); }
  .chip.todo { cursor:pointer; color:#ffe0a3; border-color:rgba(255,176,32,.55); background:rgba(70,50,10,.6); }
  .chip.todo b { color:#ffcf6b; }
  .chip.todo.pulse { animation:pulse 1.6s ease-in-out infinite; }
  .chip.health { cursor:pointer; }
  .chip.health .health-dot { color:var(--ok); font-size:14px; }
  .chip.health.warn { color:#ffe0a3; border-color:rgba(255,176,32,.55); }
  .chip.health.warn .health-dot { color:var(--warn); }
  .chip.health.bad { color:#ffc4c4; border-color:rgba(255,93,93,.55); }
  .chip.health.bad .health-dot { color:var(--bad); }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(255,176,32,.0); } 50% { box-shadow:0 0 0 6px rgba(255,176,32,.25); } }
  .spacer { flex:1; }
  body.clean #top, body.clean #quest, body.clean #detail, body.clean #help, body.clean #replayHint, body.clean #dock { display:none !important; }
  body.clean #todayPanel { display:none !important; }
  body.clean #searchPanel { display:none !important; }
  #drPanel { display:none; }
  body.place-dr .chips, body.place-dr #todayPanel, body.place-dr #quest, body.place-dr #detail, body.place-dr #zones, body.place-dr #labels, body.place-dr #bubbles, body.place-dr .catTag, body.place-dr #catPlayStatus, body.place-dr #replayHint, body.place-dr #searchPanel, body.place-dr #staleBanner, body.place-dr #tools .grp, body.place-dr #searchBtn { display:none !important; }
  body.place-dr #drPanel { display:block; position:fixed; z-index:6; top:76px; right:14px; width:320px; max-width:calc(100vw - 28px); padding:14px; box-sizing:border-box; }
  #drPanel h2 { margin:0 0 4px; color:var(--gold2); font-size:16px; } #drPanel .dr-sub { color:var(--muted); font-size:11px; }
  #drPanel .dr-actions { display:flex; gap:8px; margin:12px 0; } #drPanel .dr-actions a { flex:1; padding:8px; border:1px solid var(--line); border-radius:9px; color:var(--text); text-align:center; text-decoration:none; }
  #drPanel .dr-flow { margin:6px 0; color:var(--muted); font-size:12px; } #drPanel .dr-flow b { color:var(--gold2); }
  #drZoneSearch { width:100%; box-sizing:border-box; margin-top:10px; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:rgba(0,0,0,.2); color:var(--text); }
  #drZoneResults { display:grid; gap:4px; max-height:190px; margin-top:6px; overflow:auto; } #drZoneResults button { border:0; border-radius:7px; padding:6px 8px; background:transparent; color:var(--text); text-align:left; cursor:pointer; } #drZoneResults button:hover { background:rgba(255,255,255,.1); }
  #todayPanel { position:fixed; z-index:5; top:70px; left:14px; width:330px; max-width:calc(100vw - 28px); padding:10px 12px; }
  #todayPanel.collapsed .today-body, #todayPanel.collapsed .today-duty { display:none; }
  #todayPanel .today-summary { display:none; color:var(--gold2); font-size:12px; white-space:nowrap; }
  #todayPanel.collapsed .today-summary { display:inline; }
  #todayPanel .today-head h2, #todayPanel .today-toggle { white-space:nowrap; }
  #todayPanel .today-head { display:flex; align-items:center; gap:7px; cursor:pointer; user-select:none; }
  #todayPanel .today-head h2 { flex:1; margin:0; font-size:13px; color:var(--gold2); letter-spacing:.6px; }
  #todayPanel .today-date, #todayPanel .today-duty { color:var(--muted); font-size:11px; }
  #todayPanel .today-duty { padding:2px 6px; border-radius:999px; border:1px solid var(--line); }
  #todayPanel .today-duty.on { color:#bff0d6; border-color:rgba(53,208,127,.45); }
  #todayPanel .today-duty.off { color:#ffcfb0; border-color:rgba(255,93,93,.45); }
  #todayPanel .today-toggle { color:var(--muted); font-size:11px; }
  #todayPanel .today-main { display:flex; align-items:baseline; gap:6px; margin-top:10px; }
  #todayPanel .today-main b { color:var(--gold2); font-size:24px; }
  #todayPanel .today-main span { color:var(--muted); font-size:12px; }
  #todayPanel .today-percent { margin-left:auto; color:var(--gold2) !important; font-size:15px !important; }
  #todayPanel .today-bar, #todayPanel .today-project-bar { height:5px; overflow:hidden; border-radius:99px; background:rgba(255,255,255,.1); }
  #todayPanel .today-bar i, #todayPanel .today-project-bar i { display:block; height:100%; background:var(--gold); border-radius:inherit; }
  #todayPanel .today-split { display:flex; justify-content:space-between; gap:4px; margin-top:8px; color:var(--muted); font-size:11px; }
  #todayPanel .today-split span { white-space:nowrap; }
  #todayPanel .today-backlog { color:var(--muted); font-size:11px; margin-top:4px; }
  #todayPanel .today-stats { margin-top:7px; color:var(--muted); font-size:11px; line-height:1.5; }
  #todayPanel .today-projects { margin-top:8px; display:grid; gap:5px; }
  #todayPanel .today-project { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:5px 8px; align-items:center; font-size:11px; }
  #todayPanel .today-project .ptag { overflow:hidden; text-overflow:ellipsis; }
  #todayPanel .today-project-count { color:var(--muted); white-space:nowrap; }
  #todayPanel .today-project-bar { grid-column:1 / -1; height:3px; }
  .today-project.search-hit { outline:2px solid var(--gold); border-radius:8px; padding:3px; }
  #searchPanel { position:fixed; z-index:18; top:92px; left:50%; transform:translateX(-50%); width:min(680px, calc(100vw - 28px)); padding:12px; display:none; }
  #searchPanel.show { display:block; }
  #searchInput { width:100%; box-sizing:border-box; min-height:42px; border:1px solid var(--line); border-radius:11px; padding:9px 12px; background:rgba(0,0,0,.22); color:var(--text); font:inherit; outline:none; }
  #searchInput:focus { border-color:var(--gold); }
  #searchResults { margin-top:8px; max-height:min(62vh, 520px); overflow:auto; }
  .search-group { margin:8px 0 3px; color:var(--gold2); font-size:11px; font-weight:700; }
  .search-item { display:flex; align-items:center; gap:8px; width:100%; border:0; border-radius:9px; padding:8px 9px; background:transparent; color:var(--text); text-align:left; cursor:pointer; }
  .search-item:hover, .search-item.on { background:rgba(255,255,255,.12); }
  .search-item .search-main { min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .search-item .search-meta { color:var(--muted); font-size:11px; margin-left:5px; }
  .search-tag { flex:none; border:1px solid var(--line); border-radius:999px; padding:2px 6px; color:var(--muted); font-size:10px; }
  .search-empty { color:var(--muted); padding:12px 6px; }
  #todayPanel .today-foot { margin-top:8px; color:var(--muted); font-size:10px; }
  .chip.wx { color:#e9e4d8; border-color:rgba(182,154,100,.45); }
  .chip.wx b { font-size:13px; color:var(--gold2); }

  /* 右侧任务面板（游戏里的任务栏） */
  #quest { position:fixed; z-index:5; top:76px; right:14px; width:340px; max-height:calc(100% - 170px); display:flex; flex-direction:column; overflow:hidden; }
  #quest.collapsed .qbody { display:none; }
  .qhead { display:flex; align-items:center; gap:8px; padding:12px 14px; cursor:pointer; user-select:none; }
  .qhead h2 { margin:0; font-size:13px; letter-spacing:1px; color:var(--gold2); flex:1; }
  .qhead .count { min-width:22px; height:22px; padding:0 7px; border-radius:11px; background:var(--warn); color:#2a1d00; font-weight:800; display:inline-flex; align-items:center; justify-content:center; }
  .qhead .count.zero { background:#3a3f47; color:var(--muted); }
  .qbody { overflow:auto; padding:0 10px 10px; }
  .qsec { font-size:11px; color:var(--muted); letter-spacing:1px; margin:10px 4px 6px; }
  .card { display:flex; gap:10px; align-items:flex-start; padding:10px 10px; border-radius:12px; margin-bottom:8px; cursor:pointer; background:rgba(255,255,255,.04); border:1px solid var(--line); transition:transform .12s, background .12s; }
  .card:hover { transform:translateY(-1px); background:rgba(255,255,255,.08); }
  .card .ic { flex:none; width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; }
  .card .t { flex:1; min-width:0; }
  .card .k { font-size:11px; font-weight:700; }
  .ptag { display:inline-block; margin-right:6px; padding:1px 7px; border-radius:6px; font-size:10.5px; font-weight:700; letter-spacing:.3px; color:hsl(var(--ph) 70% 78%); background:hsl(var(--ph) 45% 24% / .75); border:1px solid hsl(var(--ph) 50% 45% / .6); white-space:nowrap; vertical-align:1px; }
  .card .ti { font-size:12.5px; line-height:1.35; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .card .m { font-size:11px; color:var(--muted); margin-top:2px; }
  .card .go { flex:none; align-self:center; font-size:11px; padding:5px 10px; border-radius:999px; background:var(--gold); color:#1b1606; font-weight:700; }
  .card.approval .ic { background:rgba(255,176,32,.2); } .card.approval .k { color:#ffcf6b; }
  .card.review .ic { background:rgba(53,208,127,.18); } .card.review .k { color:#8fe8b8; }
  .card.question .ic { background:rgba(111,168,255,.2); } .card.question .k { color:#bcd6ff; }
  .card.undelivered .ic { background:rgba(255,93,93,.18); } .card.undelivered .k { color:#ffb4b4; }
  .card.task .ic { background:rgba(182,154,100,.18); } .card.task .k { color:var(--gold2); }
  .empty { color:var(--muted); padding:8px 6px; }

  /* 任务状态彩色标签：任务列表卡片、任务详情 meta 行、「交给」窗口依赖共用。颜色只用现有主题色
     （--bad 红 / --ok 绿 / --warn 琥珀 / --info 蓝），文字取同色系的浅色以保证深色背景下的对比度；
     颜色之外始终保留中文状态名，色盲或单色显示时同样可读。未知状态只走 .st-badge 的默认文字色。 */
  .st-badge { display:inline-block; padding:0 7px; border-radius:6px; font-size:10.5px; font-weight:700; letter-spacing:.3px; white-space:nowrap; vertical-align:1px; color:var(--text); background:rgba(255,255,255,.06); border:1px solid var(--line); }
  .st-badge.st-blocked { color:#ffb4b4; background:rgba(255,93,93,.18); border-color:rgba(255,93,93,.5); }
  .st-badge.st-in_progress { color:#8fe8b8; background:rgba(53,208,127,.18); border-color:rgba(53,208,127,.5); }
  .st-badge.st-in_review { color:#ffcf6b; background:rgba(255,176,32,.18); border-color:rgba(255,176,32,.5); }
  .st-badge.st-todo { color:#bcd6ff; background:rgba(111,168,255,.2); border-color:rgba(111,168,255,.5); }
  .st-badge.st-backlog { color:var(--muted); background:rgba(163,167,176,.14); border-color:rgba(163,167,176,.4); }
  .st-badge.st-done { color:#9fd8b8; background:rgba(53,208,127,.1); border-color:rgba(53,208,127,.32); }
  .st-badge.st-cancelled { color:var(--muted); background:rgba(163,167,176,.1); border-color:rgba(163,167,176,.32); text-decoration:line-through; }

  /* 底部：镜头坞 + 工具 */
  /* 底部栏：左边工具栏、右边镜头坞，放在同一个横向容器里——镜头坞只占工具栏之外剩下的宽度，放不下就横向滚动，结构上不可能叠在一起；窄屏时镜头坞放到工具栏上一行 */
  #bottombar { position:fixed; z-index:6; left:14px; right:14px; bottom:14px; display:flex; gap:12px; align-items:center; pointer-events:none; }
  #bottombar > * { pointer-events:auto; }
  #dock { flex:1 1 0; min-width:0; display:flex; gap:4px; padding:6px; border-radius:999px; overflow-x:auto; scrollbar-width:none; }
  #dock > :first-child { margin-left:auto; } #dock > :last-child { margin-right:auto; }
  #dock::-webkit-scrollbar { display:none; }
  #dock button, #tools button { border:0; background:transparent; padding:8px 12px; border-radius:999px; cursor:pointer; white-space:nowrap; min-height:34px; }
  #dock button:hover, #tools button:hover { background:rgba(255,255,255,.1); }
  #dock button.on { background:var(--gold); color:#1b1606; font-weight:700; }
  #tools { flex:none; max-width:100%; display:flex; gap:4px; padding:6px; border-radius:999px; }  /* 不能 overflow：分组菜单要向上展开 */
  #tools .grp { position:relative; display:flex; }
  #tools .gbtn::after { content:' ▴'; font-size:10px; opacity:.65; }
  #tools .grp.open > .gbtn { background:rgba(255,255,255,.14); }
  #tools .menu { display:none; position:absolute; left:0; bottom:calc(100% + 14px); min-width:196px; flex-direction:column; gap:2px; padding:6px; border-radius:16px; z-index:8; box-shadow:0 10px 28px rgba(0,0,0,.4); }
  #tools .grp.right .menu { left:auto; right:0; }
  #tools .grp.open > .menu { display:flex; }
  #tools .menu button { width:100%; text-align:left; border-radius:10px; padding:9px 12px; }
  #tools::-webkit-scrollbar { display:none; }
  #replayHint { position:fixed; z-index:5; left:18px; bottom:64px; color:#ecdcb8; font-size:11px; }
  /* 操作提示放在底部栏的正上方（底部栏约 60px 高），不再压在镜头栏右端 */
  body.wall #bottombar, body.wall #minimap, body.wall #help, body.wall #toast, body.wall #banner, body.wall #err, body.wall #searchPanel, body.wall #modalWrap, body.wall #replayHint { display:none !important; }
  body.wall { cursor:none; }
  body.wall.lan::after { display:none; }
  body.lan::after { content:'👁 局域网只读'; position:fixed; z-index:9; right:14px; top:4px; padding:2px 10px; border-radius:0 0 8px 8px; background:rgba(182,154,100,.9); color:#14161a; font-size:11px; font-weight:700; pointer-events:none; }
  #minimap { position:fixed; z-index:5; left:14px; bottom:72px; width:220px; height:94px; border-radius:10px; border:1px solid rgba(182,154,100,.45); background:rgba(14,16,20,.72); backdrop-filter:blur(6px); cursor:crosshair; box-shadow:0 6px 18px rgba(0,0,0,.35); }
  body.clean #minimap { display:none !important; }
  #perfPanel { position:fixed;left:8px;bottom:112px;z-index:12;max-width:min(500px,calc(100vw - 16px));padding:8px 10px;font-size:11px;pointer-events:none;overflow-wrap:anywhere; }
  body.clean #perfPanel { display:none; }
  #stage canvas { touch-action:none; }
  #help { position:fixed; z-index:5; right:14px; bottom:64px; color:var(--muted); font-size:11px; text-shadow:0 1px 2px #000; pointer-events:none; }

  /* 人物卡片 */
  #detail { position:fixed; z-index:6; left:14px; top:76px; width:300px; padding:14px; display:none; }
  #detail h3 { margin:0 0 6px; font-size:15px; }
  #detail .row { display:flex; justify-content:space-between; gap:10px; padding:3px 0; color:var(--muted); }
  #detail .row span:last-child { color:var(--text); text-align:right; }
  #detail .close, .modal .close { position:absolute; top:8px; right:12px; cursor:pointer; color:var(--muted); background:none; border:0; font-size:20px; }
  .chat-head,.chat-compose,.chat-task-box,.chat-suggest{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.chat-messages{display:grid;gap:8px;max-height:42vh;overflow:auto;margin:10px 0}.chat-msg{padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04);overflow-wrap:anywhere}.chat-user{margin-left:12%}.chat-agent{margin-right:12%}.chat-system{text-align:center;color:var(--muted)}.chat-meta{font-size:11px;color:var(--muted);margin-bottom:4px}.chat-task-box input{min-width:160px;flex:1}.chat-suggest{margin-top:7px;padding-top:7px;border-top:1px solid var(--line)}
  .btn { border:1px solid var(--line); background:rgba(255,255,255,.06); padding:8px 14px; border-radius:10px; cursor:pointer; }
  .btn:hover { background:rgba(255,255,255,.12); }
  .btn.gold { background:var(--gold); color:#1b1606; border-color:transparent; font-weight:700; }
  .btn.ok { background:#2aa865; border-color:transparent; color:#fff; font-weight:700; }
  .btn.bad { background:rgba(255,93,93,.15); border-color:rgba(255,93,93,.6); color:#ffc2c2; }
  .btn:disabled { opacity:.5; cursor:default; }

  /* 弹窗：在本页完成操作 */
  #modalWrap { position:fixed; inset:0; z-index:20; background:rgba(5,6,8,.55); display:none; align-items:center; justify-content:center; padding:20px; }
  #modalWrap.show { display:flex; }
  .modal { position:relative; width:min(760px,100%); max-width:100%; min-width:0; max-height:calc(100% - 40px); overflow:auto; padding:20px 22px; background:var(--glass2); }
  .modal h2 { margin:0 0 4px; font-size:17px; padding-right:30px; }
  .modal .meta { color:var(--muted); font-size:12px; margin-bottom:12px; }
  .modal .sec { margin:14px 0 6px; font-size:12px; color:var(--gold2); letter-spacing:1px; }
  .md { white-space:normal; line-height:1.6; font-size:13px; color:#e6e3dc; }
  .md p { margin:6px 0; } .md code { background:rgba(255,255,255,.08); padding:1px 5px; border-radius:4px; font-size:12px; }
  .md pre { background:rgba(0,0,0,.35); padding:8px 10px; border-radius:8px; overflow:auto; font-size:12px; }
  .md h4 { margin:10px 0 4px; font-size:13.5px; color:#fff; }
  .md ul { margin:4px 0; padding-left:20px; }
  .fold { max-height:220px; overflow:auto; padding:10px 12px; border-radius:10px; background:rgba(0,0,0,.22); border:1px solid var(--line); }
  .cm { padding:10px 12px; border-radius:10px; background:rgba(255,255,255,.04); border:1px solid var(--line); margin-bottom:8px; }
  .cm .who { font-size:11px; color:var(--gold2); margin-bottom:4px; }
  .q { padding:12px; border-radius:12px; background:rgba(255,255,255,.04); border:1px solid var(--line); margin-bottom:10px; }
  .q .prompt { font-weight:600; margin-bottom:8px; }
  .opt { display:flex; gap:10px; align-items:flex-start; padding:9px 10px; border-radius:10px; border:1px solid var(--line); margin-bottom:6px; cursor:pointer; }
  .opt:hover { background:rgba(255,255,255,.05); }
  .opt input { margin-top:3px; accent-color:var(--gold); }
  .opt .d { color:var(--muted); font-size:12px; }
  textarea, input[type=text] { width:100%; min-height:70px; padding:10px; border-radius:10px; border:1px solid var(--line); background:rgba(0,0,0,.3); color:var(--text); font:inherit; resize:vertical; }
  input.one { min-height:0; height:38px; resize:none; }
  select { width:100%; height:38px; padding:0 10px; border-radius:10px; border:1px solid var(--line); background:#1d2024; color:var(--text); font:inherit; }
  .fl { display:block; font-size:12px; color:var(--gold2); margin:12px 0 5px; letter-spacing:1px; }
  .row2 { display:grid; grid-template-columns:1fr 2fr; gap:12px; }
  @media (max-width: 600px) { .row2 { grid-template-columns:1fr; } }
