<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="./assets/logo.png">
<title>智序工场 · 公司运行大屏</title>
<style>
:root{--bg:#101216;--panel:#191d24;--panel2:#20252e;--line:#39414c;--text:#f4f1eb;--muted:#aeb5bf;--gold:#e1c47d;--green:#4cdb83;--yellow:#f0b429;--red:#ff6666;--blue:#83b7ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:clamp(1rem,1.05vw,2.75rem)/1.42 system-ui,"Microsoft YaHei",sans-serif}body.stale{filter:grayscale(.8);background:#0c0d0f}body.shift{transform:translate(var(--shift-x),var(--shift-y))}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(430px,1fr);grid-template-rows:auto 1fr;gap:12px;padding:14px}
header{grid-column:1/-1;display:flex;align-items:center;gap:1em;padding:.55em .8em;border:1px solid var(--line);border-radius:.7em;background:var(--panel)}h1{margin:0;color:var(--gold);font-size:clamp(1.375rem,1.5vw,2.125rem);letter-spacing:.06em}.sp{flex:1}.duty,.timestamp{color:var(--muted);font-size:1em}.light{display:flex;align-items:center;gap:.5em;padding:.35em .8em;border:1px solid var(--line);border-radius:99px;font-weight:700}.dot{width:.75em;height:.75em;border-radius:50%;background:var(--muted);box-shadow:0 0 .6em currentColor}.green .dot{background:var(--green);color:var(--green)}.yellow .dot{background:var(--yellow);color:var(--yellow)}.red .dot{background:var(--red);color:var(--red)}
#stage{position:relative;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:.7em;background:#0a0c10}.stage-frame{position:absolute;inset:0}.stage-frame iframe{width:100%;height:100%;border:0}.stage-fallback{display:none;position:absolute;inset:0;place-items:center;background:radial-gradient(circle at 50% 35%,#263342,#090b0f);color:var(--muted);text-align:center;padding:10%}.stage-fallback.show{display:grid}.stage-tag{position:absolute;left:1em;bottom:1em;padding:.35em .8em;border:1px solid var(--line);border-radius:99px;background:#080a0dcc;font-size:1em}.stage-time{position:absolute;right:1em;bottom:1em;color:var(--muted);font-size:1em}
#side{min-height:0;display:grid;grid-template-rows:auto auto auto minmax(0,1fr);gap:.7em}.card{min-height:0;border:1px solid var(--line);border-radius:.7em;background:var(--panel);padding:.7em .9em;overflow:hidden}.card h2{margin:0 0 .4em;color:var(--muted);font-size:1em;letter-spacing:.08em;font-weight:700}.risk-card{border-color:color-mix(in srgb,var(--risk) 60%,var(--line));}.risk-card .risk-line{display:flex;align-items:center;gap:.6em;font-size:1.25em;font-weight:800}.risk-reason{margin-top:.3em;color:var(--muted);font-size:1em}.big{font-size:clamp(2rem,3.7vw,8rem);line-height:1;font-weight:850;color:var(--gold);font-variant-numeric:tabular-nums}.launch-row{display:flex;align-items:baseline;gap:.6em}.launch-row b{font-size:1.25em}.launch-row span{color:var(--muted);font-size:1em}.bar{height:.6em;margin:.5em 0;border-radius:99px;background:#313845;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#b69a64,#f0d997)}.next{font-size:1em;color:var(--muted)}.next.over{color:var(--red)}
.decision{border-color:rgba(240,180,41,.65)}.decision.empty{border-color:var(--line)}.decision-list,.risk-list{display:grid;gap:.35em;max-height:9em;overflow:hidden}.item{padding:.3em .5em;border-left:.25em solid var(--line);background:rgba(255,255,255,.035);font-size:1em}.item.red{border-color:var(--red)}.item.yellow{border-color:var(--yellow)}.muted{color:var(--muted)}.small{font-size:1em}
#carousel{display:flex;flex-direction:column;min-height:0}.carousel-head{display:flex;justify-content:space-between;align-items:center}.dots{display:flex;gap:.35em}.dots i{width:.5em;height:.5em;border-radius:50%;background:#59616c}.dots i.on{background:var(--gold)}#carouselBody{min-height:0;overflow:hidden;flex:1}.slide{height:100%;display:flex;flex-direction:column;gap:.5em}.slide h3{margin:0;color:var(--gold);font-size:1.1em}.rows{display:grid;gap:.4em;overflow:hidden}.row{display:flex;align-items:center;gap:.6em}.row .name{flex:0 0 30%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .num{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}.mini-bar{height:.5em;flex:1;border-radius:99px;background:#303743;overflow:hidden}.mini-bar i{display:block;height:100%;background:linear-gradient(90deg,#9e8658,#dec787)}.standup-item,.recent-item{padding:.4em .5em;border-left:.25em solid var(--gold);background:rgba(255,255,255,.035)}.recent-item{min-height:2.8em}.badge{display:inline-block;padding:.1em .4em;border-radius:99px;border:1px solid var(--line);font-size:1em;color:var(--muted)}.badge.ok{color:var(--green);border-color:var(--green)}.badge.warn{color:var(--yellow);border-color:var(--yellow)}
#cut{position:fixed;z-index:9;top:0;left:0;right:0;padding:.4em;text-align:center;background:var(--red);color:#fff;font-weight:800;display:none}#cut.show{display:block}#expired{position:fixed;z-index:10;inset:0;display:none;place-items:center;background:#0b0d10cc;color:#fff;font-size:clamp(1.75rem,3vw,3.75rem);font-weight:800;letter-spacing:.08em}body.stale #expired{display:grid}.brief{position:fixed;z-index:8;inset:0;display:none;place-items:center;background:#101216f2;padding:7vw}.brief.show{display:grid}.brief-card{width:min(1100px,90vw);border:.12em solid var(--gold);border-radius:1.5em;background:var(--panel2);padding:2.5em}.brief-card h2{margin:0 0 1em;color:var(--gold);font-size:clamp(1.875rem,4vw,4.25rem)}.brief-card .brief-items{display:grid;gap:.75em;font-size:clamp(1.25rem,2vw,2.25rem)}
@media(max-width:1100px){#app{grid-template-columns:minmax(0,1.25fr) minmax(350px,1fr);padding:.6em;gap:.55em}.card{padding:.6em .7em}.big{font-size:3rem}}
@media(max-aspect-ratio:4/3){#app{grid-template-columns:1fr;grid-template-rows:auto minmax(240px,46%) minmax(0,1fr);overflow:hidden}#stage{min-height:0}#side{grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"risk launch" "dec carousel";gap:8px}#riskCard{grid-area:risk}#launch{grid-area:launch}#decisions{grid-area:dec}#carousel{grid-area:carousel}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="cut">数据中断，保留最后一次成功数据 · <span id="lastAt">–</span></div><div id="expired">数据已过期</div>
<div id="app">
 <header><h1>智序工场 · 公司运行大屏</h1><span id="duty" class="duty">读取中…</span><span class="sp"></span><span id="light" class="light green"><i class="dot"></i><span id="lightText">读取中…</span></span><button id="wallFullscreen" class="timestamp" style="font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:.4em;cursor:pointer" title="全屏 / 退出全屏"><span id="clock">–</span> ⛶</button></header>
 <section id="stage"><div class="stage-frame"><iframe id="office" src="/?wall=1" title="办公室"></iframe><div id="fallback" class="stage-fallback">办公室画面暂时不可用<br><span class="small">领导视图数据仍在更新</span></div></div><span class="stage-tag" id="stageTag">全景巡航</span><span class="stage-time" id="stageTime">–</span></section>
 <main id="side">
  <section class="card risk-card" id="riskCard"><h2>风险灯 · 当前状态</h2><div class="risk-line"><i class="dot"></i><span id="riskText">读取中…</span></div><div id="riskReason" class="risk-reason">–</div></section>
  <section class="card" id="launch"><h2>上线进度</h2><div id="todayBig" class="big">– / –</div><div class="muted small">今日完成 / 全部任务</div><div id="launchBody" class="muted">读取中…</div></section>
  <section class="card decision" id="decisions"><h2>需要领导决定</h2><div id="decBody" class="muted">读取中…</div></section>
  <section class="card" id="carousel"><div class="carousel-head"><h2>运行摘要</h2><span class="dots" id="dots"></span></div><div id="carouselBody"><div class="muted">读取中…</div></div></section>
 </main>
</div>
<section id="brief" class="brief"><div class="brief-card"><h2>今日晨会</h2><div id="briefItems" class="brief-items"></div></div></section>
<script type="module" src="./wall.js"></script>
</body></html>
