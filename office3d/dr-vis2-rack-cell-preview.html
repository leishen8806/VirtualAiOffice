<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>DR 仓配 · 货架与穿梭机样板（组件预览）</title>
  <script type="importmap">{"imports":{"three":"/vendor/three/three.module.js"}}</script>
  <style>
    :root { color-scheme:dark; --bg:#182327; --panel:#223238; --text:#f2e8d3; --line:#567177; --accent:#e0af55 }
    * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif }
    header { padding:12px 20px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line) }
    h1 { margin:0; font-size:19px } p { margin:0 } .tag { background:#7a3b1a; color:#ffe9d2; padding:2px 10px; border-radius:4px; font-weight:600 }
    .tools { display:flex; flex-wrap:wrap; gap:8px } button { min-height:40px; font:inherit; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:5px; padding:6px 12px; cursor:pointer }
    :focus-visible { outline:3px solid var(--accent); outline-offset:2px }
    #stage { height:calc(100vh - 118px); min-height:400px } canvas { display:block; width:100%; height:100%; touch-action:none }
    footer { padding:8px 20px; border-top:1px solid var(--line); color:var(--accent); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  </style>
</head>
<body>
  <header>
    <div><h1>高位货架 + 轨道式托盘穿梭机 · 样板 <span class="tag">组件预览，尚未正式接入</span></h1><p>固定种子 4207 · 地面与灯光仅为预览夹具，不属于构件 · 拖动旋转 / 滚轮缩放</p></div>
    <div class="tools"><button id="v-over">总览</button><button id="v-rack">货架近景</button><button id="v-shuttle">穿梭机近景</button><button id="v-aisle">通道视角</button><button id="shuttle-move">穿梭机移动 ▶</button><button id="quality">画质：高</button></div>
  </header>
  <div id="stage"></div>
  <footer><p id="readout" role="status">准备…</p></footer>
  <script type="module">
    import * as THREE from 'three'
    import { CAMPUS, CAMPUS_ZONES, CAMPUS_SHUTTLE_STRIP } from '/office-layout.js'
    import { buildVis2RackCell } from '/dr-vis2-rack-cell.js'
    const layout = { campus: CAMPUS, zones: CAMPUS_ZONES, shuttle: CAMPUS_SHUTTLE_STRIP }
    const stage = document.getElementById('stage'), readout = document.getElementById('readout')
    const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.shadowMap.enabled = true
    renderer.outputColorSpace = THREE.SRGBColorSpace; stage.appendChild(renderer.domElement)
    const scene = new THREE.Scene(); scene.background = new THREE.Color(0xb9c0c4)
    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 400)
    // 预览自带的极简轨道控制（未引入 OrbitControls：vendor 里没有，也不下载外部文件）
    const controls = { target: new THREE.Vector3(), az: 0, el: 0.5, r: 50, update() { const c = Math.cos(this.el); camera.position.set(this.target.x + this.r * c * Math.sin(this.az), this.target.y + this.r * Math.sin(this.el), this.target.z + this.r * c * Math.cos(this.az)); camera.lookAt(this.target) } }
    let drag = null; const el = renderer.domElement
    el.addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; el.setPointerCapture(e.pointerId) }); el.addEventListener('pointerup', () => { drag = null })
    el.addEventListener('pointermove', (e) => { if (!drag) return; controls.az -= (e.clientX - drag[0]) * 0.005; controls.el = Math.max(0.05, Math.min(1.5, controls.el + (e.clientY - drag[1]) * 0.005)); drag = [e.clientX, e.clientY]; controls.update() })
    el.addEventListener('wheel', (e) => { e.preventDefault(); controls.r = Math.max(3, Math.min(160, controls.r * (e.deltaY > 0 ? 1.1 : 0.9))); controls.update() }, { passive: false })
    scene.add(new THREE.HemisphereLight(0xf2f2f0, 0xa4a29c, 1.25))
    const sun = new THREE.DirectionalLight(0xfffaf0, 1.35); sun.position.set(-120, 40, -20); sun.castShadow = true; scene.add(sun)
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(90, 50), new THREE.MeshStandardMaterial({ color: 0xc9c6be, roughness: 0.92 })) // 预览夹具：浅灰混凝土，不属于构件
    floor.rotation.x = -Math.PI / 2; floor.position.set(-128, -0.001, -2); floor.receiveShadow = true; scene.add(floor)
    const holder = new THREE.Group(); scene.add(holder)
    let cell = null, tier = 'high', moving = false, t0 = 0
    function build() { cell?.dispose(); cell = buildVis2RackCell({ THREE, root: holder, layout, quality: { tier } }); cell.group.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true } }); window.__vis2 = { cell, THREE, scene, camera, renderer, view }; readout.textContent = JSON.stringify(cell.summary()) }
    function view(pos, target) { controls.target.set(...target); const d = new THREE.Vector3(pos[0] - target[0], pos[1] - target[1], pos[2] - target[2]); controls.r = d.length(); controls.el = Math.asin(d.y / controls.r); controls.az = Math.atan2(d.x, d.z); controls.update() }
    const views = { over: [[-186, 34, 40], [-128, 1, -1]], rack: [[-160, 10, 22], [-141, 2, -2]], shuttle: [[-154, 4, 12], [-146, 0.6, 0]], aisle: [[-150, 1.7, 12], [-137, 1.8, -4]] }
    for (const [id, key] of [['v-over', 'over'], ['v-rack', 'rack'], ['v-shuttle', 'shuttle'], ['v-aisle', 'aisle']]) document.getElementById(id).onclick = () => view(...views[key])
    document.getElementById('shuttle-move').onclick = () => { moving = !moving; t0 = performance.now(); document.getElementById('shuttle-move').textContent = moving ? '穿梭机移动 ■' : '穿梭机移动 ▶'; if (!moving) cell.setShuttle({ z: -1, lift: 0 }) }
    document.getElementById('quality').onclick = (event) => { tier = tier === 'high' ? 'low' : 'high'; event.target.textContent = `画质：${tier === 'high' ? '高' : '低'}`; build() }
    function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix() }
    addEventListener('resize', resize); resize(); build(); view(...views.over)
    renderer.setAnimationLoop(() => { if (moving) { const s = (performance.now() - t0) / 1000, k = (Math.sin(s * 0.5) + 1) / 2; cell.setShuttle({ z: -6.6 + k * 11.2, lift: k > 0.85 ? 0.12 : 0, status: 'moving' }) } renderer.render(scene, camera) })
  </script>
</body>
</html>
