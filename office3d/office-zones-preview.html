<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>办公区功能区预览</title><style>:root{--bg:#f4f1ea;--fg:#49453e;--panel:#fffdf7;--line:#b89b64}:root[data-theme=dark]{--bg:#292721;--fg:#f6f2e9;--panel:#39362f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}header,footer{padding:14px 20px;border-bottom:1px solid var(--line)}h1,p{margin:0}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}button,select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;color:var(--fg);background:var(--panel);min-height:40px}#stage{height:calc(100vh - 170px);min-height:320px}canvas{display:block;width:100%;height:100%}</style></head><body><header><h1>三类功能区 · 模块预览</h1><p>休闲展示、创意讨论、餐饮休憩；仅静态模块，所有标牌为模拟空间。</p><div class="tools"><select id="tier"><option value="high">高档</option><option value="low">低档</option></select><button id="theme">深色主题</button></div></header><div id="stage"></div><footer id="metrics">加载中…</footer><script type="module">
import * as THREE from '/vendor/three/three.module.js';import {LAYOUT_V3} from './office-layout.js';import {buildOfficeZones} from './office-zones.js';const scene=new THREE.Scene(),root=new THREE.Group(),stage=document.querySelector('#stage');scene.add(root);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));stage.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0xb89b64,1.4));const camera=new THREE.PerspectiveCamera(42,1,.1,100);let value
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}function build(){value?.dispose();value=buildOfficeZones({THREE,root,layout:LAYOUT_V3,canvasTex,low:tier.value==='low'});const s=value.summary();metrics.textContent=`模块批次 ${s.calls} · 三角形 ${Math.round(s.triangles)} · 真实席位 0 · 模拟功能区 3`;camera.position.set(18,15,22);camera.lookAt(2,0,0)}function resize(){renderer.setSize(stage.clientWidth,stage.clientHeight);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix()}function frame(){requestAnimationFrame(frame);scene.background=new THREE.Color(document.documentElement.dataset.theme==='dark'?0x292721:0xf4f1ea);renderer.render(scene,camera)}tier.onchange=build;theme.onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';theme.textContent=dark?'浅色主题':'深色主题'};build();resize();addEventListener('resize',resize);frame()
</script></body></html>
