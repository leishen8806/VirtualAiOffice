<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>DR 仓配 · 调度中控室与接待展示（组件预览）</title>
  <script type="importmap">{"imports":{"three":"/vendor/three/three.module.js"}}</script>
  <style>
    :root { color-scheme:dark; --bg:#182327; --panel:#223238; --text:#f2e8d3; --line:#567177; --accent:#e0af55 }
    * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif }
    header { padding:12px 20px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line) }
    h1 { margin:0; font-size:19px } p { margin:0 } .tag { background:#7a3b1a; color:#ffe9d2; padding:2px 10px; border-radius:4px; font-weight:600 }
    .tools { display:flex; flex-wrap:wrap; gap:8px } button { min-height:40px; font:inherit; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:5px; padding:6px 12px; cursor:pointer }
    :focus-visible { outline:3px solid var(--accent); outline-offset:2px }
    #stage { height:calc(100vh - 118px); min-height:400px } canvas { display:block; width:100%; height:100%; touch-action:none }
    footer { padding:8px 20px; border-top:1px solid var(--line); color:var(--accent); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  </style>
</head>
<body>
  <header>
    <div><h1>调度中控室 + 接待展示 · 样板 <span class="tag">组件预览，尚未正式接入</span></h1><p>运行指标来自预览页喂入的既有演示快照（dr-demo-snapshot.js）· 地面与灯光仅为预览夹具 · 拖动旋转 / 滚轮缩放</p></div>
    <div class="tools"><button id="v-front">中控 · 正面</button><button id="v-oblique">中控 · 斜侧</button><button id="v-back">中控 · 从后向东看仓储</button><button id="v-reception">接待台</button><button id="v-showcase">展示墙</button><button id="v-lobby">前厅看展示墙</button><button id="v-interior">室内总览</button><button id="brand">品牌：素材</button><button id="advance">快照推进 ▶</button><button id="quality">画质：高</button></div>
  </header>
  <div id="stage"></div>
  <footer><p id="readout" role="status">准备…</p></footer>
  <script type="module">
    import * as THREE from 'three'
    import { CAMPUS, CAMPUS_ZONES, CAMPUS_SHUTTLE_STRIP } from '/office-layout.js'
    import { buildVis2DispatchSuite } from '/dr-vis2-dispatch-suite.js'
    import { DEMO_BASE_SNAPSHOT, demoSnapshotAt } from '/dr-demo-snapshot.js'
    const layout = { campus: CAMPUS, zones: CAMPUS_ZONES, shuttle: CAMPUS_SHUTTLE_STRIP }
    const stage = document.getElementById('stage'), readout = document.getElementById('readout')
    const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.shadowMap.enabled = true
    renderer.outputColorSpace = THREE.SRGBColorSpace; stage.appendChild(renderer.domElement)
    const scene = new THREE.Scene(); scene.background = new THREE.Color(0xb9c0c4)
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 300)
    const controls = { target: new THREE.Vector3(), az: 0, el: 0.3, r: 20, update() { const c = Math.cos(this.el); camera.position.set(this.target.x + this.r * c * Math.sin(this.az), this.target.y + this.r * Math.sin(this.el), this.target.z + this.r * c * Math.cos(this.az)); camera.lookAt(this.target) } }
    let drag = null; const el = renderer.domElement
    el.addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; el.setPointerCapture(e.pointerId) }); el.addEventListener('pointerup', () => { drag = null })
    el.addEventListener('pointermove', (e) => { if (!drag) return; controls.az -= (e.clientX - drag[0]) * 0.005; controls.el = Math.max(0.02, Math.min(1.5, controls.el + (e.clientY - drag[1]) * 0.005)); drag = [e.clientX, e.clientY]; controls.update() })
    el.addEventListener('wheel', (e) => { e.preventDefault(); controls.r = Math.max(2, Math.min(120, controls.r * (e.deltaY > 0 ? 1.1 : 0.9))); controls.update() }, { passive: false })
    scene.add(new THREE.HemisphereLight(0xfaf8f2, 0xb8b4aa, 1.7))
    const sun = new THREE.DirectionalLight(0xfffaf0, 1.1); sun.position.set(-130, 40, 40); scene.add(sun)
    // 预览夹具：室内暖米色地面与三个区域的范围提示，不属于构件
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 32), new THREE.MeshStandardMaterial({ color: 0xd9d1c0, roughness: 0.8 })); floor.rotation.x = -Math.PI / 2; floor.position.set(-149, -0.001, 15); scene.add(floor)
    const holder = new THREE.Group(); scene.add(holder)
    // 宿主提供的 canvasTex：与 app.js 同签名 canvasTex(w, h, draw)，draw 收到 (ctx2d, w, h)
    const canvasTex = (w, h, draw) => { const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h; draw(canvas.getContext('2d'), w, h); const t = new THREE.CanvasTexture(canvas); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t }
    // 已批准的品牌素材（assets/logo.png 完整标识、assets/logo-mark.png 图标）由预览页加载后传入；构件自己不加载任何图片
    const loadImage = (src) => new Promise((resolve) => { const image = new Image(); image.onload = () => resolve(image); image.onerror = () => resolve(null); image.src = src })
    const logos = { full: await loadImage('/assets/logo.png'), mark: await loadImage('/assets/logo-mark.png') }
    let useAssets = true
    let suite = null, tier = 'high', playing = false, t0 = performance.now(), lastTick = -1
    const snapshotAt = (ms) => demoSnapshotAt(DEMO_BASE_SNAPSHOT, ms)
    function build() { suite?.dispose(); suite = buildVis2DispatchSuite({ THREE, root: holder, layout, quality: { tier }, canvasTex, snapshot: snapshotAt(0), logo: useAssets ? logos : null }); window.__vis2b = { suite, THREE, scene, camera, renderer, view, snapshotAt }; readout.textContent = JSON.stringify(suite.summary()) }
    function view(pos, target) { controls.target.set(...target); const d = new THREE.Vector3(pos[0] - target[0], pos[1] - target[1], pos[2] - target[2]); controls.r = d.length(); controls.el = Math.asin(d.y / controls.r); controls.az = Math.atan2(d.x, d.z); controls.update() }
    const views = { front: [[-158.5, 1.8, 8], [-167.7, 2.1, 8]], oblique: [[-156.2, 3.4, 13.2], [-165, 1.4, 6.5]], back: [[-165, 1.7, 8], [-150, 1.8, 8]], reception: [[-161, 2.6, 29.6], [-161.5, 1.5, 23.8]], showcase: [[-141, 2.6, 28.8], [-142, 1.9, 20.5]], lobby: [[-164.5, 2.0, 28.2], [-142, 2.1, 20.6]], interior: [[-176, 12, 40], [-150, 1.5, 22]] }
    for (const [id, key] of [['v-front', 'front'], ['v-oblique', 'oblique'], ['v-back', 'back'], ['v-reception', 'reception'], ['v-showcase', 'showcase'], ['v-lobby', 'lobby'], ['v-interior', 'interior']]) document.getElementById(id).onclick = () => view(...views[key])
    document.getElementById('brand').onclick = (e) => { useAssets = !useAssets; suite.setLogo(useAssets ? logos : null); e.target.textContent = `品牌：${useAssets ? '素材' : '占位'}`; readout.textContent = JSON.stringify(suite.summary()) }
    document.getElementById('advance').onclick = (e) => { playing = !playing; t0 = performance.now(); e.target.textContent = playing ? '快照推进 ■' : '快照推进 ▶' }
    document.getElementById('quality').onclick = (e) => { tier = tier === 'high' ? 'low' : 'high'; e.target.textContent = `画质：${tier === 'high' ? '高' : '低'}`; build() }
    function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix() }
    addEventListener('resize', resize); resize(); build(); view(...views.front)
    renderer.setAnimationLoop(() => { if (playing) { const tick = Math.floor((performance.now() - t0) / 1800); if (tick !== lastTick) { lastTick = tick; suite.update(snapshotAt(tick * 1800)) } } renderer.render(scene, camera) })
  </script>
</body>
</html>
