name: CI

on:
  pull_request:
  push:
    branches: [main, fix/ci-portable-tests]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi
        shell: bash
      - run: npm run test:browser
      - name: Unit tests (node --test)
        run: npm test
      - name: Package spec tests (tsc + node --test)
        run: npm run test:packages
      - name: Packaged layout verification
        run: npm run verify:packaged-layout
