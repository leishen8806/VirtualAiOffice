name: CI

on:
  pull_request:
  push:
    branches: [main, fix/ci-portable-tests]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi
        shell: bash
      - run: npm run test:browser
      - name: Unit tests (node --test)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/unit-test.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep "^not ok" /tmp/unit-test.log | head -80 | while IFS= read -r line; do echo "::error::${line}"; done
            echo "===== FAILED TEST DETAILS ====="
            grep -A10 "^not ok" /tmp/unit-test.log | head -200
            exit $status
          fi
      - name: Package spec tests (tsc + node --test)
        run: npm run test:packages
      - name: Packaged layout verification
        run: npm run verify:packaged-layout
